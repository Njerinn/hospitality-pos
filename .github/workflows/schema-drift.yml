name: Schema Drift Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Apply all migrations to fresh DB
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5432/pos
          DATABASE_SSL: 'false'
        run: node scripts/migrate.mjs

      - name: Verify schema matches code
        env:
          DATABASE_URL: postgres://pos:pos@localhost:5432/pos
          DATABASE_SSL: 'false'
        run: node scripts/check-schema-drift.mjs
