name: Deploy Production

on:
  workflow_run:
    workflows: ["Deploy Staging"]
    types: [completed]

jobs:
  deploy-production:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production   # Requires reviewer + wait timer per pre-flight step 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: verified-dist
          path: apps/api/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: verified-hash
          path: apps/api
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify byte-level hash (paranoid re-check)
        working-directory: apps/api
        run: |
          sha256sum -c artifact.sha256
          echo "✅ production artifact bytes match the verified staging build"

      - name: Extract baked SHA from verified artifact
        id: baked
        run: |
          SHA=$(grep -oE "BUILD_SHA = '[^']+'" apps/api/dist/build-sha.js \
                | sed "s/BUILD_SHA = '//; s/'//")
          [ -n "$SHA" ] || { echo "no baked sha"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy (production)
        run: curl -fsS "${{ secrets.RENDER_PRODUCTION_DEPLOYHOOK }}"

      - name: Wait for production to converge
        run: |
          EXPECTED="${{ steps.baked.outputs.sha }}"
          URL="${{ vars.PRODUCTION_BASE_URL }}"
          for i in $(seq 1 40); do
            SHA=$(curl -fsS "$URL/health" | jq -r .sha 2>/dev/null || true)
            if [ "$SHA" = "$EXPECTED" ]; then
              echo "✅ production sha = $EXPECTED (attempt $i)"
              exit 0
            fi
            echo "attempt $i: saw $SHA (want $EXPECTED)"
            sleep 15
          done
          echo "❌ production did not converge"; exit 1

      - name: Post-deploy smoke test
        run: ./scripts/smoke-test.sh "${{ vars.PRODUCTION_BASE_URL }}" "${{ steps.baked.outputs.sha }}"
